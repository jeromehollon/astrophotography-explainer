[project]
name = "astro-tools"
version = "0.1.0"
description = "Project-local image-processing helpers for the astrophotography explainer (FITS/XISF I/O, STF stretch, star detection/FWHM, starlet denoise)."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2",
    "scipy>=1.13",
    "astropy>=6",
    "photutils>=2",
    "xisf>=0.9",
    "pillow>=10",
    "pypng>=0.20220715.0",
]

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false
